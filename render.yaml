services:
  - type: web
    name: mindflare-profile-sync
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/web
    buildCommand: "true"
    startCommand: "node scripts/profile-sync-server.mjs"
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PROFILE_SYNC_SERVICE_SECRET
        sync: false
